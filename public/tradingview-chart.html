<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>TradingView 차트</title>
    <style>
      html, body { height: 100%; width: 100%; margin: 0; background: #fff; }
      .tradingview-widget-container { height: 100%; width: 100%; }

      .tradingview-widget-copyright a { color: #2962ff; }

    <script src="/tradingview-chart.js" defer></script>

    <div id="chart" class="tradingview-widget-container"></div>
